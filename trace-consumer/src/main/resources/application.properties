# ===============================
# Spring Core / Server
# ===============================
server.port=9081
spring.main.banner-mode=off
spring.main.log-startup-info=true

# ===============================
# Datasource POSTGRESQL
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5424/trace_db
spring.datasource.username=postgres
spring.datasource.password=${POSTGRES_PASSWORD:123456789}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=false

# ===============================
# RABBIT_MQ
# ===============================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=${RABBIT_MQ_PASSWORD:admin}
spring.rabbitmq.virtual-host=/traces
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=5
spring.rabbitmq.listener.simple.retry.initial-interval=500
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-interval=10000

# ===============================
# Trace-consumer
# ===============================
trace.rabbit.exchange=trace.topic
trace.rabbit.routing-key-template=trace.v1.%s
trace.rabbit.routing-pattern=trace.v1.#
trace.rabbit.queues=trace.queue.0
trace.rabbit.dlq=trace.queue.dlq

trace.timezone=Europe/Paris
trace.schema.version=1

# ===============================
# Actuator
# ===============================
management.endpoints.web.exposure.include=health, info, startup, metrics, refresh, env
management.metrics.export.prometheus.enabled=true
management.endpoint.flyway.enabled=true
management.endpoint.startup.enabled=true
management.server.port=9087

# ===============================
# OpenAPI
# ===============================
springdoc.show-actuator=true
springdoc.use-management-port=false

springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.urls[0].name=admin
springdoc.swagger-ui.urls[0].url=/v3/api-docs/admin
springdoc.swagger-ui.urls[1].name=actuator
springdoc.swagger-ui.urls[1].url=/v3/api-docs/actuator

springdoc.group-configs[0].group=admin
springdoc.group-configs[0].paths-to-match=/admin/**
springdoc.group-configs[1].group=actuator
springdoc.group-configs[1].paths-to-match=/actuator/**

# ===============================
# Logging
# ===============================

logging.level.org.flywaydb=DEBUG
logging.level.org.hibernate.orm.connections.pooling=WARN

logging.level.org.springframework.boot.context.config=DEBUG

logging.level.fr.cnamts.cpam33.traces.consumer.services=TRACE